version: '3.8'

services:
  postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  hasura:
    image: hasura/graphql-engine:v2.36.0
    restart: always
    ports:
      - '8081:8080'
    depends_on:
      - postgres
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_DEV_MODE: 'true'
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: nhost-admin-secret
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"a440373f-bef0-4eaa-b22e-d18cf67225c5440373f-bef0-4eaa-b22e-d18cf67225c5"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public

  auth:
    image: nhost/hasura-auth:0.21.2
    restart: always
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - hasura
    environment:
      AUTH_HOST: '0.0.0.0'
      AUTH_PORT: 4000
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      HASURA_GRAPHQL_GRAPHQL_URL: http://hasura:8080/v1/graphql
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"a440373f-bef0-4eaa-b22e-d18cf67225c5440373f-bef0-4eaa-b22e-d18cf67225c5"}'
      HASURA_GRAPHQL_ADMIN_SECRET: nhost-admin-secret
      AUTH_CLIENT_URL: http://localhost:3000
      AUTH_SERVER_URL: http://localhost:4000

  storage:
    image: nhost/hasura-storage:0.6.0
    restart: always
    ports:
      - '5000:5000'
    depends_on:
      - postgres
      - hasura
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      HASURA_GRAPHQL_GRAPHQL_URL: http://hasura:8080/v1/graphql
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"a440373f-bef0-4eaa-b22e-d18cf67225c5440373f-bef0-4eaa-b22e-d18cf67225c5"}'
      HASURA_GRAPHQL_ADMIN_SECRET: nhost-admin-secret

volumes:
  postgres_data:
