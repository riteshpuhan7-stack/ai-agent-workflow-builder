tables:
  - table:
      schema: public
      name: organizations
    object_relationships: []
    array_relationships:
      - name: org_members
        using:
          foreign_key_constraint_on: org_id
      - name: workflows
        using:
          foreign_key_constraint_on: org_id
    select_permissions:
      - role: owner
        permission:
          columns:
            - id
            - name
            - monthly_quota
            - monthly_used
            - quota_reset_date
            - created_at
          filter:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in: [owner, editor, viewer]
      - role: editor
        permission:
          columns:
            - id
            - name
            - monthly_quota
            - monthly_used
            - quota_reset_date
            - created_at
          filter:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _in: [editor, viewer]
      - role: viewer
        permission:
          columns:
            - id
            - name
            - monthly_quota
            - monthly_used
            - quota_reset_date
            - created_at
          filter:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: viewer
    insert_permissions:
      - role: owner
        permission:
          check:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner
          columns:
            - name
            - monthly_quota
    update_permissions:
      - role: owner
        permission:
          check:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
              role:
                _eq: owner
          columns:
            - name
            - monthly_quota
            - monthly_used
            - quota_reset_date

