- type: replace_metadata
  args:
    allow_inconsistent_metadata: false
    metadata:
      version: 3
      sources:
        - name: default
          kind: postgres
          tables:
            - table:
                schema: public
                name: organizations
            - table:
                schema: public
                name: org_members
            - table:
                schema: public
                name: workflows
            - table:
                schema: public
                name: workflow_steps
            - table:
                schema: public
                name: workflow_triggers
            - table:
                schema: public
                name: workflow_runs
            - table:
                schema: public
                name: step_runs
          configuration:
            connection_info:
              use_prepared_statements: false
              database_url:
                from_env: HASURA_GRAPHQL_DATABASE_URL
              isolation_level: read-committed
      actions: []
